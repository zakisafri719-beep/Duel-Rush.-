<div id="app">
  <canvas id="screen"></canvas>
  <div id="probe"></div>

<script>
'use strict';
/* ===== أدوات عامة ===== */
const W = 480, H = 270, TAU = Math.PI * 2;
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const hex2rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const rgb2hex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); };

function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 144665)) | 0;

  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);

function activeSynergies(cards) {
  const set = new Set(cards);
  return SYNERGIES.filter(sy => sy.c.every(k => set.has(k)));
}
function computeStats(cards) {
  const s = baseStats();
  for (const k of cards) CARDS[k].a(s);
  const syn = activeSynergies(cards);
  for (const sy of syn) sy.a(s);
  s.syn = syn;
  return s;
}
/* سحب 3 بطاقات: نُفضّل التي تكمّل تناسقاً، ونقلّل تكرار ما يملكه اللاعب */
function rollChoices(cards, n = 3) {
  const owned = new Set(cards), keys = Object.keys(CARDS);
  const w = {};
  for (const k of keys) {
    let v = [58 / 21, 30 / 31, 12 / 15][rarityOf(k)];
    if (owned.has(k)) v *= .3;
    for (const sy of SYNERGIES) {
      if (!sy.c.includes(k)) continue;
      const other = sy.c.find(x => x !== k);
      if (owned.has(other) && !owned.has(k)) v += 2.2;
    }
    w[k] = v;
  }
  const out = [];
  while (out.length < n) {
    let tot = 0; for (const k of keys) if (!out.includes(k)) tot += w[k];
    let r = Math.random() * tot, chosen = null;
    for (const k of keys) { if (out.includes(k)) continue; r -= w[k]; if (r <= 0) { chosen = k; break; } }
    if (!chosen) chosen = keys.find(k => !out.includes(k));
    out.push(chosen);
  }
  return out;
}
